<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作台</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#f7f8fa; --card:#ffffff; --border:#e5e6eb; --border2:#d6d8de;
  --text:#1f2329; --muted:#8a909c; --accent:#3370ff; --accent-d:#245bdb;
  --warn:#ff8800; --danger:#f54a45; --danger-d:#d8392f;
  --hover:#f2f3f5; --sel:#e8f0ff; --zebra:#fafbfc;
  --thead-top:120px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.55}
/* ===== 头部 ===== */
header{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.head-inner{max-width:1240px;margin:0 auto;padding:14px 22px}
h1{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 0 3px rgba(51,112,255,.15)}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.search{flex:1;min-width:220px;padding:8px 14px;border-radius:8px;border:1px solid var(--border2);
  background:#fff;color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,112,255,.12)}
.search::placeholder{color:#b6bbc4}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;
  color:var(--muted);cursor:pointer;font-size:13px;user-select:none;transition:.15s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);border-color:var(--border2)}
.tab .cnt{font-size:11px;background:var(--panel);color:var(--muted);border-radius:10px;padding:1px 7px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.filterrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.filterrow .flabel{color:var(--muted);font-size:12px}
.fsel{padding:6px 10px;border-radius:7px;border:1px solid var(--border2);background:#fff;
  color:var(--text);font-size:13px;outline:none;cursor:pointer}
.fsel:focus{border-color:var(--accent)}
/* ===== 主体 ===== */
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 48px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.tablecard{background:var(--card);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04)}
table.bitable{width:100%;border-collapse:collapse;font-size:13px}
.bitable thead th{position:sticky;top:var(--thead-top);background:var(--panel);color:var(--muted);
  font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);
  white-space:nowrap;z-index:5;font-size:12px;letter-spacing:.3px}
.bitable tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:top;
  color:var(--text);max-width:420px}
.bitable tbody tr:last-child td{border-bottom:none}
.bitable tbody tr:nth-child(even){background:var(--zebra)}
.bitable thead th:first-child{border-top-left-radius:12px}
.bitable thead th:last-child{border-top-right-radius:12px}
.bitable tbody tr:last-child td:first-child{border-bottom-left-radius:12px}
.bitable tbody tr:last-child td:last-child{border-bottom-right-radius:12px}
.bitable tbody tr:hover{background:var(--hover)}
.cell-text{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.ed{cursor:pointer;border-radius:6px;outline:1px dashed transparent;transition:.12s}
.ed:hover{outline-color:var(--accent);background:var(--sel)}
.badge{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:500}
.badge.运行中{color:#1a7f37;background:#e6f4ea}
.badge.已暂停{color:var(--warn);background:#fff3e0}
.badge.决策{color:#1a7f37;background:#e6f4ea}
.badge.学习{color:var(--accent);background:#e8f0ff}
.badge.洞察{color:#8a3ffc;background:#f1e9ff}
.badge.任务{color:var(--warn);background:#fff3e0}
.badge.其他,.badge.用户级,.badge.项目级{color:var(--muted);background:#eef0f3}
.badge.有改动{color:var(--danger);background:#fdeceb}
.badge.干净{color:#1a7f37;background:#e6f4ea}
.badge.未分类{color:var(--muted);background:#eef0f3}
/* 自动分类复核弹窗 */
.achead{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.aclist{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto}
.acrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.acinfo{flex:1;min-width:0}
.actitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acmeta{font-size:12px;color:var(--muted);margin-top:3px}
.acsec{display:inline-block;padding:1px 7px;border-radius:6px;background:#eef0f3;color:var(--muted);margin-right:4px}
.acbadge{display:inline-block;padding:1px 8px;border-radius:6px;background:#e6f4ea;color:#1a7f37;font-weight:600}
.acbadge.new{background:#fff4e5;color:#b26a00}
.acscore{margin-left:6px;color:var(--muted)}
.path{font-size:11px;color:var(--muted);word-break:break-all;margin-top:5px}
/* 操作列 */
.opcell{white-space:nowrap;width:1%}
.opcell .btn{margin-right:6px}
.opcell .btn:last-child{margin-right:0}
.btn{border:1px solid var(--border2);background:#fff;color:var(--text);border-radius:7px;
  padding:5px 12px;cursor:pointer;font-size:12px;transition:.15s;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:4px 11px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn.ghost{background:#fff;color:var(--muted);border-color:var(--border)}
.btn.ghost:hover{color:var(--danger);border-color:#f3c2c0}
.btn.danger{color:var(--danger);border-color:#f3c2c0}
.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{padding:54px 20px;text-align:center;color:var(--muted);font-size:14px}
/* ===== Git 仓库卡片 ===== */
.gitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:16px}
.repocard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.repocard .rp{font-weight:600;word-break:break-all;font-size:13px}
.repocard .rmeta{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.repocard .rbranch{color:var(--muted);font-size:12px}
.repocard .remotes{margin:6px 0 10px;font-size:12px;color:var(--muted)}
.repocard .remotes div{word-break:break-all;padding:2px 0}
.repocard .rops{display:flex;gap:8px;flex-wrap:wrap}
.repocard .rpname{font-weight:600;font-size:15px;word-break:break-all;line-height:1.3}
.repocard .rpath{color:var(--muted);font-size:11px;word-break:break-all;margin-top:2px}
.repocard .sec{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.repocard .sectitle{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.repocard .sectitle .cnt{color:var(--muted);font-weight:400}
.repocard .brow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.repocard .bname{font-family:ui-monospace,Menlo,Consolas,monospace;flex:1;word-break:break-all}
.repocard .bname.cur{color:var(--accent);font-weight:600}
.repocard .cur-tag{font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:6px}
.repocard .btn.xs{font-size:11px;padding:3px 8px}
.repocard .newbranch{display:flex;gap:6px;margin-top:8px}
.repocard .newbranch input{flex:1;padding:5px 8px;border:1px solid var(--border2);border-radius:7px;font-size:12px;outline:none;font-family:inherit}
.repocard .newbranch input:focus{border-color:var(--accent)}
.repocard .commit{display:flex;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.repocard .commit:last-child{border-bottom:none}
.repocard .chash{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);white-space:nowrap;font-size:11px;padding-top:1px}
.repocard .cmsg{flex:1;word-break:break-all;line-height:1.4}
.repocard .cmeta{color:var(--muted);font-size:11px;white-space:nowrap}
.repocard .rbrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);padding:2px 0;word-break:break-all}
.code-pre{background:#0f1115;color:#e6e6e6;padding:14px;border-radius:10px;max-height:60vh;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
/* ===== 浮层 / 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(20,22,28,.4);display:none;align-items:center;
  justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;padding:20px;width:min(640px,92vw);
  box-shadow:0 16px 48px rgba(0,0,0,.22);max-height:86vh;overflow:auto;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 14px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;border-radius:6px}
.modal .x:hover{background:var(--hover);color:var(--text)}
.modal .flabel{color:var(--muted);font-size:12px;margin:12px 0 5px;font-weight:500}
.modal .flabel:first-child{margin-top:0}
.mctrl{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:8px;font-size:13px;
  font-family:inherit;outline:none;resize:vertical;color:var(--text);background:#fff;transition:.15s}
textarea.mctrl{min-height:110px;line-height:1.6}
.mctrl:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,112,255,.12)}
.modal .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.modal .hint{color:var(--muted);font-size:11px;margin-top:10px;line-height:1.5}
/* ===== 备份列表 ===== */
.bak-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bak-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fafbfc}
.bak-item .bf{font-size:12px;word-break:break-all;flex:1}
.bak-item .bm{color:var(--muted);font-size:11px;white-space:nowrap}
/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2329;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;z-index:200;
  max-width:82vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:.96}
.toast .fp{color:#7fd18b}
footer{padding:16px 22px;color:var(--muted);font-size:12px;max-width:1240px;margin:0 auto;line-height:1.6}
[data-theme="dark"]{
  --bg:#16181c; --panel:#202329; --card:#202329; --border:#33373e; --border2:#3c4047;
  --text:#e7e8eb; --muted:#9aa0a6; --hover:#2a2e35; --sel:#243154; --zebra:#1d2025;
}
[data-theme="dark"] header,[data-theme="dark"] .tablecard,[data-theme="dark"] .tab,
[data-theme="dark"] .fsel,[data-theme="dark"] .modal,[data-theme="dark"] .repocard,
[data-theme="dark"] .bak-item,[data-theme="dark"] .search,[data-theme="dark"] .mctrl{background:var(--card);color:var(--text)}
[data-theme="dark"] .bitable tbody tr:nth-child(even){background:var(--zebra)}
[data-theme="dark"] .code-pre{background:#0b0c0f}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <h1><span class="dot"></span> AI 工作台</h1>
    <div class="sub">本地可编辑视图 · 编辑 / 删除真实改写本地文件（写前自动备份 .bak） · 仅本机访问</div>
    <div class="bar">
      <input class="search" id="search" placeholder="搜索任务 / 记忆 / Skill / 亮点 / 对话记忆…" oninput="onSearch()">
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="filterrow" id="filters"></div>
  </div>
</header>
<div class="wrap">
  <div class="toolbar" id="toolbar"></div>
  <div class="tablecard"><div id="tableHost"></div></div>
</div>
<footer>数据来源：automations 数据库、MEMORY.md、skills、highlights.md、conversation_memory.md、本地 Git 仓库。修改/删除会写回这些文件本身并生成备份。可在「平台令牌」中配置 GitHub/Gitee 令牌，直接对本工作台及本地 Git 仓库做推送 / 拉取 / 克隆。</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3><span id="mTitle">编辑</span><span class="x" onclick="closeEditor()">×</span></h3>
    <div id="mBody"></div>
    <div class="hint" id="mHint"></div>
    <div class="row">
      <button class="btn ghost" onclick="closeEditor()">取消</button>
      <button class="btn primary" id="saveBtn" onclick="onSave()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  {key:"automations", label:"定时任务"},
  {key:"memory",      label:"记忆"},
  {key:"skills",      label:"Skill"},
  {key:"highlights",  label:"每日亮点"},
  {key:"conversation_memory", label:"对话记忆"},
  {key:"git_repos",   label:"Git 仓库"},
  {key:"processes",   label:"进程"},
];
let CATEGORIES = ["自媒体","电商","AI技术","运营","其他"];  // 由后端 /api/data 动态下发（含自动生成的新类别）
const COLS = {
  automations:[
    {key:"名称", edit:"text"},
    {key:"状态", edit:"select", opts:["运行中","已暂停"]},
    {key:"频率", edit:null},
    {key:"说明", edit:null},
    {key:"下次运行", edit:null},
    {key:"分类", edit:"category"},
  ],
  memory:[
    {key:"主题", edit:null},
    {key:"内容", edit:"area"},
    {key:"来源", edit:null},
    {key:"分类", edit:"category"},
  ],
  skills:[
    {key:"名称", edit:null},
    {key:"位置", edit:null},
    {key:"功能说明", edit:"area"},
    {key:"路径", edit:null},
    {key:"分类", edit:"category"},
  ],
  highlights:[
    {key:"类型", edit:"select", opts:["决策","学习","洞察","任务","其他"]},
    {key:"日期", edit:null},
    {key:"内容", edit:"area"},
    {key:"分类", edit:"category"},
  ],
  conversation_memory:[
    {key:"类型", edit:"select", opts:["决策","学习","洞察","任务","其他"]},
    {key:"日期", edit:null},
    {key:"内容", edit:"area"},
    {key:"分类", edit:"category"},
  ],
  git_repos:[],
};
const CAN_DELETE = {automations:true, memory:true, skills:false, highlights:true, conversation_memory:true, git_repos:false};

let DATA={}, COUNTS={}, FILTERS={};
let activeKey=SECTIONS[0].key, query="", activeFilters={};
let editCtx=null;
let wbStatus=null;

function el(tag,cls,t){const e=document.createElement(tag);if(cls)e.className=cls;if(t!=null)e.textContent=t;return e;}
function badgeClass(t){return (['决策','学习','洞察','任务','运行中','已暂停','用户级','项目级','有改动','干净','未分类'].includes(t))?t:'其他';}
function sectionLabel(k){return (SECTIONS.find(s=>s.key===k)||{}).label||k;}
function editFieldsFor(sec){return (COLS[sec]||[]).filter(c=>c.edit && c.edit!=='category').map(c=>({key:c.key,edit:c.edit,opts:c.opts}));}

function syncTheadTop(){
  const h=document.querySelector('header').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--thead-top', h+'px');
}

async function load(){
  const st=await (await fetch('/api/wb_status')).json();
  wbStatus=st;
  applyTheme(); syncTheadTop();
  if(window.ResizeObserver){
    new ResizeObserver(()=>syncTheadTop()).observe(document.querySelector('header'));
  }
  if(!st.configured){
    renderSetup(st);
    return;
  }
  const r=await fetch('/api/data'); const j=await r.json();
  DATA=j.data; COUNTS=j.counts; FILTERS=j.filters;
  if(Array.isArray(j.categories) && j.categories.length) CATEGORIES=j.categories;
  buildTabs(); buildFilters(); buildToolbar(); render();
}
function shortPath(p){ if(!p) return ''; const s=String(p).replace(/\\/g,'/'); const parts=s.split('/'); return parts.length>2 ? '…/'+parts.slice(-2).join('/') : s; }
function renderSetup(st){
  document.getElementById('tabs').innerHTML='';
  document.getElementById('filters').innerHTML='';
  const tb=document.getElementById('toolbar'); tb.innerHTML='';
  const sp=el('div','spacer'); tb.appendChild(sp);
  const themeBtn=el('button','btn ghost','主题'); themeBtn.onclick=toggleTheme; tb.appendChild(themeBtn);
  const host=document.getElementById('tableHost'); host.innerHTML='';
  const wrap=el('div'); wrap.style.maxWidth='640px'; wrap.style.margin='0 auto';
  const card=el('div'); card.style.background='var(--card)'; card.style.border='1px solid var(--border)';
  card.style.borderRadius='12px'; card.style.padding='24px'; card.style.boxShadow='0 1px 4px rgba(0,0,0,.04)';
  const h=document.createElement('h3'); h.textContent='未检测到 WorkBuddy 数据目录'; h.style.margin='0 0 8px'; h.style.fontSize='16px'; h.style.fontWeight='600';
  card.appendChild(h);
  const p=document.createElement('div'); p.style.color='var(--muted)'; p.style.lineHeight='1.7'; p.style.marginBottom='16px';
  p.innerHTML='工作台直接读取你本机的 WorkBuddy 数据（定时任务 / 记忆 / Skill）。<br>请填写 WorkBuddy 数据目录的绝对路径，保存后即刻连接。<br><b style="color:var(--warn)">注意：全程不会写入任何示例数据，也不会在你目录里新建文件。</b>';
  card.appendChild(p);
  const label=el('div','flabel','WorkBuddy 数据目录路径'); label.style.marginBottom='6px';
  card.appendChild(label);
  const input=document.createElement('input'); input.className='mctrl'; input.id='wbPath';
  input.placeholder='例如：C:\\Users\\你的用户名\\.workbuddy 或 /home/你/.workbuddy';
  card.appendChild(input);
  const err=document.createElement('div'); err.id='wbErr'; err.style.color='var(--danger)'; err.style.fontSize='12px'; err.style.marginTop='8px'; err.style.minHeight='16px';
  card.appendChild(err);
  const row=el('div','row'); row.style.marginTop='16px';
  const save=el('button','btn primary','保存并连接'); save.onclick=saveWbHome; row.appendChild(save);
  card.appendChild(row);
  wrap.appendChild(card); host.appendChild(wrap);
  setTimeout(()=>input.focus(),30);
}
async function saveWbHome(){
  const input=document.getElementById('wbPath'); const path=input.value.trim();
  const err=document.getElementById('wbErr');
  if(!path){err.textContent='请填写路径';return;}
  const r=await fetch('/api/wb_home',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});
  const j=await r.json();
  if(!j.ok){err.textContent='连接失败：'+(j.error||'');return;}
  toast('已连接 WorkBuddy：'+(j.wb_home||'')); await load();
}
function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  SECTIONS.forEach(s=>{
    const d=el('div','tab'+(s.key===activeKey?' active':''));
    d.appendChild(document.createTextNode(s.label+' '));
    d.appendChild(el('span','cnt',(COUNTS[s.key]||0)));
    d.onclick=()=>{activeKey=s.key;query='';activeFilters={};document.getElementById('search').value='';buildTabs();buildFilters();buildToolbar();render();};
    t.appendChild(d);
  });
}
function buildFilters(){
  const b=document.getElementById('filters'); b.innerHTML='';
  const dims=FILTERS[activeKey]||[];
  if(!dims.length){b.appendChild(el('span','flabel','（本页仅支持顶部搜索）'));return;}
  dims.forEach(d=>{
    b.appendChild(el('span','flabel',d.label+'：'));
    const sel=document.createElement('select'); sel.className='fsel';
    const o0=document.createElement('option'); o0.value='__all__';o0.textContent='全部'; sel.appendChild(o0);

function filtered(){
  let items=DATA[activeKey]||[];
  for(const f in activeFilters){
    const v=activeFilters[f];
    if(f==='__date_range__'){
      if(v==='近7天'||v==='近30天'){
        const cut=new Date(); cut.setDate(cut.getDate()-(v==='近7天'?7:30));
        const cs=cut.toISOString().slice(0,10);
        items=items.filter(it=>(it['日期']||'')>=cs);
      }
      continue;
    }
    items=items.filter(it=>(it[f]||'')===v);
  }
  if(query){const q=query.toLowerCase();items=items.filter(it=>JSON.stringify(it).toLowerCase().includes(q));}
  if(activeKey==='highlights'||activeKey==='conversation_memory'){ items=items.slice().sort((a,b)=>(b['日期']||'').localeCompare(a['日期']||'')); }
  return items;
}

function parseFreqCn(s){
  const r={ftype:'每日',hour:9,minute:0,byday:'MO',bymonthday:1,scheduled_at:null};
  if(!s) return r;
  if(s.startsWith('每天')){ const m=s.match(/(\d+):(\d+)/); if(m){r.hour=+m[1];r.minute=+m[2];} }
  else if(s.startsWith('每周')){ const wmap={'一':'MO','二':'TU','三':'WE','四':'TH','五':'FR','六':'SA','日':'SU'}; const m=s.match(/周(.)/); if(m)r.byday=wmap[m[1]]||'MO'; const t=s.match(/(\d+):(\d+)/); if(t){r.hour=+t[1];r.minute=+t[2];} r.ftype='每周'; }
  else if(s.startsWith('每月')){ const m=s.match(/(\d+)/); if(m)r.bymonthday=Math.min(28,+m[1]); const t=s.match(/(\d+):(\d+)/); if(t){r.hour=+t[1];r.minute=+t[2];} r.ftype='每月'; }
  else if(s.startsWith('一次性')){ const m=s.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); if(m){r.scheduled_at=`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`;} r.ftype='一次性'; }
  return r;
}

  ['运行中','已暂停'].forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;st.appendChild(op);});
  body.appendChild(st);
  document.getElementById('mHint').textContent='将写入 automations 数据库（与运行时同源），并生成 .bak 备份。新建后由 WorkBuddy 调度执行。';
  document.getElementById('overlay').style.display='flex';
  setTimeout(()=>name.focus(),30);
  toggleFreq();
}
function toggleFreq(){
  const t=document.getElementById('aFtype').value;
  document.getElementById('aTime').style.display=(t==='一次性')?'none':'';
  document.getElementById('aTimeLabel').style.display=(t==='一次性')?'none':'';
  document.getElementById('aWdWrap').style.display=(t==='每周')?'':'none';
  document.getElementById('aMdWrap').style.display=(t==='每月')?'':'none';
  document.getElementById('aOnceWrap').style.display=(t==='一次性')?'':'none';
}
function renderProcesses(host){
  if(!DATA.processes){ host.appendChild(el('div','empty','正在加载进程列表…')); loadProcesses(); return; }
  let items=DATA.processes;
  if(query){ const q=query.toLowerCase(); items=items.filter(it=>JSON.stringify(it).toLowerCase().includes(q)); }
  if(!items.length){ host.appendChild(el('div','empty', query?'没有匹配的进程':'（未扫描到监听本地端口的进程）')); syncTheadTop(); return; }
  const table=el('table','bitable');
  const thead=el('thead'); const trh=el('tr');
  ['PID','名称','端口','内存','操作'].forEach(h=>trh.appendChild(el('th',null,h)));
  thead.appendChild(trh); table.appendChild(thead);
  const tb=el('tbody');
  items.forEach(it=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,String(it.pid)));
    tr.appendChild(el('td',null,it.name||'（未知）'));
    tr.appendChild(el('td',null,(it.ports||[]).join(', ')||'-'));
    tr.appendChild(el('td',null,it.mem_human||it.mem||'-'));
    const tdOp=el('td','opcell');
    if(it.protected){
      const b=el('button','btn sm','受保护'); b.disabled=true; b.title=it.reason||'系统/自身关键进程，不可结束'; tdOp.appendChild(b);
    } else {
      const b=el('button','btn sm danger','结束'); b.onclick=()=>killProc(it.pid, it.name); tdOp.appendChild(b);
    }
    tr.appendChild(tdOp);
    tb.appendChild(tr);
  });
  table.appendChild(tb); host.appendChild(table);
  syncTheadTop();
}
async function loadProcesses(){
  try{
    const r=await fetch('/api/processes'); const j=await r.json();
    DATA.processes=j.processes||[]; COUNTS.processes=DATA.processes.length; buildTabs();
    if(activeKey==='processes') render();
  }catch(e){ toast('加载进程失败',true); }
}
async function killProc(pid,name){
  if(!confirm('确定结束进程 '+name+' (PID '+pid+')？\n注意：结束进程可能导致对应程序异常退出。')) return;
  const r=await fetch('/api/kill_process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid})});
  const j=await r.json();
  if(!j.ok){ toast('结束失败：'+(j.err||j.error||''),true); }
  else { toast('已结束 '+name+' (PID '+pid+')'); await loadProcesses(); }
}
function renderGit(host){
  const items=filtered();
  if(!items.length){host.appendChild(el('div','empty',emptMsg()));return;}
  const grid=el('div','gitgrid');
  items.forEach(r=>{
    const card=el('div','repocard');
    // 项目名（标题）+ 路径（副标题）
    card.appendChild(el('div','rpname',r['项目名']||r['路径']));
    card.appendChild(el('div','rpath',r['路径']));
    const meta=el('div','rmeta');
    meta.appendChild(el('span','badge '+badgeClass(r['状态']),r['状态']));
    meta.appendChild(el('span','rbranch','当前分支：'+(r['分支']||'-')));
    if(r['改动数']>0) meta.appendChild(el('span','rbranch','改动 '+r['改动数']+' 处'));
    card.appendChild(meta);

    // 分支管理
    const bsec=el('div','sec');
    const btitle=el('div','sectitle','分支管理');
    btitle.appendChild(el('span','cnt',(r['分支列表']?r['分支列表'].length:0)+' 个本地分支'));
    bsec.appendChild(btitle);
    (r['分支列表']||[]).forEach(b=>{
      const row=el('div','brow');
      const nm=el('div','bname'+(b.current?' cur':''),b.name);
      row.appendChild(nm);
      if(b.current){ row.appendChild(el('span','cur-tag','当前')); }
      else {
        const sw=el('button','btn xs','切换'); sw.onclick=()=>gitAct('checkout',r['路径'],b.name);
        row.appendChild(sw);
        const del=el('button','btn xs danger','删除'); del.onclick=()=>{
          if(confirm('确认删除本地分支「'+b.name+'」？')) gitAct('delete_branch',r['路径'],b.name);
        };
        row.appendChild(del);
      }
      bsec.appendChild(row);
    });
    // 远程跟踪分支（只读展示）
    (r['远程分支']||[]).forEach(rb=>{
      const row=el('div','brow');
      row.appendChild(el('div','bname',rb));
      row.appendChild(el('span','cnt','远程'));
      bsec.appendChild(row);
    });
    // 新建分支
    const nb=el('div','newbranch');
    const inp=el('input'); inp.placeholder='新建分支名（默认基于当前分支）';
    const nbb=el('button','btn xs primary','新建');
    nbb.onclick=()=>{ const v=inp.value.trim(); if(v) gitAct('create_branch',r['路径'],v); };
    nb.appendChild(inp); nb.appendChild(nbb);
    bsec.appendChild(nb);
    card.appendChild(bsec);

    // 提交信息
    const csec=el('div','sec');
    const ctitle=el('div','sectitle','提交信息');
    ctitle.appendChild(el('span','cnt','最近 '+(r['提交']?r['提交'].length:0)+' 条'));
    csec.appendChild(ctitle);
    if(r['提交']&&r['提交'].length){
      r['提交'].forEach(c=>{
        const row=el('div','commit');
        row.appendChild(el('div','chash',c.hash));
        const msg=el('div','cmsg',c.message);
        const meta2=el('div','cmeta',(c.author||'')+' · '+(c.date||''));
        msg.appendChild(meta2);
        row.appendChild(msg);
        csec.appendChild(row);
      });
    } else csec.appendChild(el('div','cmeta','（暂无提交记录）'));
    card.appendChild(csec);

    // 远程
    const rem=el('div','remotes');
    if(r['远程']&&r['远程'].length){
      r['远程'].forEach(rm=>rem.appendChild(el('div',null,rm['name']+' → '+rm['url']+' ('+rm['type']+')')));
    } else rem.appendChild(el('div',null,'（无远程）'));
    card.appendChild(rem);

    // 操作
    const ops=el('div','rops');
    const mk=(label,fn)=>{const b=el('button','btn sm',label); b.onclick=fn; return b;};
    ops.appendChild(mk('fetch',()=>gitAct('fetch',r['路径'])));
    ops.appendChild(mk('pull',()=>gitAct('pull',r['路径'])));
    ops.appendChild(mk('推送',()=>gitAct('push',r['路径'])));
    card.appendChild(ops);
    grid.appendChild(card);
  });
  host.appendChild(grid);
}
async function gitAct(action,path,branch){
  const r=await fetch('/api/git_action',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,path,branch})});
  const j=await r.json();
  if(!j.ok){ toast('操作失败：'+(j.err||j.error||'')+(j.err&&j.err.includes('TLS')?'（远程操作受本机 git TLS 限制，可改用 GitHub Desktop/Gitee 客户端）':''),true); }
  else { await load(); toast('已执行 '+action+(j.out?('：'+j.out.trim().split('\n').slice(-1)[0]):'')); }
}
async function openBackups(){
  const r=await fetch('/api/backups'); const j=await r.json();
  editCtx={viewOnly:true};
  document.getElementById('mTitle').textContent='备份管理（误删恢复）';
  const body=document.getElementById('mBody'); body.innerHTML='';
  if(!j.backups.length){ body.appendChild(el('div','cell-text','（暂无 .bak 备份文件）')); }
  else {
    const list=el('div','bak-list');
    j.backups.forEach(b=>{
      const item=el('div','bak-item');
      item.appendChild(el('div','bf',b['file']+'  →  '+b['original']));
      item.appendChild(el('div','bm',b['mtime']));
      const rb=el('button','btn sm primary','还原');
      rb.onclick=async()=>{ if(!confirm('还原「'+b['file']+'」？将覆盖当前文件（原文件会再备份一次）。'))return;
        const rr=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:b['file']})});
        const rj=await rr.json(); if(!rj.ok){toast('还原失败：'+(rj.error||''),true);return;} closeEditor(); await load(); toast('已还原：'+rj.path); };
      item.appendChild(rb); list.appendChild(item);
    });
    body.appendChild(list);
  }
  document.getElementById('mHint').textContent='每个 .bak 是对应文件上次写前的副本。还原会把它复制回原文件。';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('overlay').style.display='flex';
}
async function openTokens(){
  const r=await fetch('/api/tokens'); const j=await r.json();
  const tk=j.tokens||{};
  editCtx={viewOnly:true};
  document.getElementById('mTitle').textContent='平台令牌管理（GitHub / Gitee）';
  const body=document.getElementById('mBody'); body.innerHTML='';
  const platforms=[
    {key:'github',label:'GitHub',hint:'填写 Personal Access Token（ghp_...）。令牌写入本机 .git/config（insteadOf），不进仓库、不会被推送。'},
    {key:'gitee',label:'Gitee',hint:'填写登录名 + 私人令牌。Gitee 需要「用户名:令牌」格式（如 msjr123:xxxx）。'},
  ];
  platforms.forEach(p=>{
    const t=tk[p.key]||{configured:false,username:'',token_masked:''};
    body.appendChild(el('div','flabel',p.label+(t.configured?'（已配置 '+t.token_masked+'）':'')));
    const card=el('div','bak-item'); card.style.flexDirection='column'; card.style.alignItems='stretch';
    if(p.key==='gitee'){
      const u=document.createElement('input'); u.className='mctrl'; u.id='tok_'+p.key+'_user';
      u.placeholder='Gitee 登录名（如 msjr123）'; u.value=t.username||''; card.appendChild(u);
    }
    const tok=document.createElement('input'); tok.className='mctrl'; tok.id='tok_'+p.key;
    tok.placeholder=p.key==='github'?'GitHub PAT（ghp_...）':'Gitee 私人令牌';
    tok.style.marginTop='8px'; card.appendChild(tok);
    const row=el('div','row'); row.style.marginTop='10px';
    const save=el('button','btn primary','保存'+p.label); save.onclick=()=>saveToken(p.key); row.appendChild(save);
    if(t.configured){
      const del=el('button','btn danger','删除'+p.label); del.onclick=()=>delToken(p.key); row.appendChild(del);
    }
    card.appendChild(row);
    body.appendChild(card);
    body.appendChild(el('div','hint',p.hint));
  });
  document.getElementById('mHint').textContent='令牌用于工作台直接对 GitHub/Gitee 做 push/pull/clone 等远程操作；明文仅存于本机 .git/config，建议机器不再使用时去对应平台撤销。';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('overlay').style.display='flex';
}
async function saveToken(plat){
  const token=document.getElementById('tok_'+plat).value.trim();
  const user=document.getElementById('tok_'+plat+'_user')?document.getElementById('tok_'+plat+'_user').value.trim():'';
  if(!token){toast('令牌不能为空',true);return;}
  const r=await fetch('/api/tokens',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({platform:plat,username:user,token})});
  const j=await r.json();
  if(!j.ok){toast('保存失败：'+(j.error||''),true);return;}
  await openTokens(); toast('已保存 '+plat+' 令牌');
}
async function delToken(plat){
  if(!confirm('删除 '+plat+' 令牌？删除后远程操作将改用本机凭据管理器（可能需弹窗授权）。'))return;
  const r=await fetch('/api/tokens',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'delete',platform:plat})});
  const j=await r.json();
  if(!j.ok){toast('删除失败：'+(j.error||''),true);return;}
  await openTokens(); toast('已删除 '+plat+' 令牌');
}
function closeEditor(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('saveBtn').style.display='';
  editCtx=null;
}
async function onSave(){
  if(!editCtx)return;
  if(editCtx.viewOnly)return;
  if(editCtx.add)return saveAdd();
  if(editCtx.addCM)return saveAddCM();
  if(editCtx.addAuto)return saveAddAutomation();
  if(editCtx.editAuto)return saveEditAutomation();
  if(editCtx.category)return saveCategory();
  if(editCtx.multi)return saveMulti();
  return saveEditor();
}
async function saveCategory(){
  const cat=document.getElementById('mCat').value;
  const r=await fetch('/api/update_category',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({section:activeKey,id:editCtx.id,category:cat})});
  const j=await r.json();
  if(!j.ok){toast('保存失败：'+(j.error||''),true);return;}
  closeEditor(); await load(); toast('已设置分类：'+(cat||'未分类'));
}
async function saveEditor(){

async function saveMulti(){

  if(!j.ok){toast('保存失败：'+(j.error||''),true);return;}

async function saveAdd(){

    body:JSON.stringify({type,content,category})});
  const j=await r.json();
  if(!j.ok){toast('新增失败：'+(j.error||''),true);return;}

}
async function saveAddCM(){
  const type=document.getElementById('mType').value;
  const category=document.getElementById('mCat').value;
  const content=document.getElementById('mContent').value.trim();
  if(!content){toast('内容不能为空',true);return;}
  const r=await fetch('/api/add_cm',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type,content,category})});
  const j=await r.json();
  if(!j.ok){toast('新增失败：'+(j.error||''),true);return;}

}
async function saveAddAutomation(){
  const ftype=document.getElementById('aFtype').value;
  const payload={name:document.getElementById('aName').value.trim(),
    prompt:document.getElementById('aPrompt').value.trim(), ftype,
    status:document.getElementById('aStatus').value};
  if(!payload.name){toast('名称不能为空',true);return;}
  if(!payload.prompt){toast('说明不能为空',true);return;}
  if(ftype==='一次性'){
    payload.scheduled_at=document.getElementById('aOnce').value||null;
    if(!payload.scheduled_at){toast('请选择执行时间',true);return;}
  } else {
    const tv=document.getElementById('aTime').value||'09:00'; const sp=tv.split(':');
    payload.hour=parseInt(sp[0])||9; payload.minute=parseInt(sp[1])||0;
    if(ftype==='每周') payload.byday=document.getElementById('aWday').value;
    if(ftype==='每月') payload.bymonthday=parseInt(document.getElementById('aMday').value)||1;
  }
  const r=await fetch('/api/add_automation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json();
  if(!j.ok){toast('新建失败：'+(j.error||''),true);return;}
  closeEditor(); await load(); toast('已新建定时任务（备份于 '+j.path+'.bak）');
}
async function saveEditAutomation(){
  const ftype=document.getElementById('aFtype').value;
  const values={名称:document.getElementById('aName').value.trim(),
    说明:document.getElementById('aPrompt').value.trim(), 状态:document.getElementById('aStatus').value,
    频率类型:ftype};
  if(!values['名称']){toast('名称不能为空',true);return;}
  if(!values['说明']){toast('说明不能为空',true);return;}
  if(ftype==='一次性'){
    values['执行时间']=document.getElementById('aOnce').value||null;
    if(!values['执行时间']){toast('请选择执行时间',true);return;}
  } else {
    const tv=document.getElementById('aTime').value||'09:00'; const sp=tv.split(':');
    values['小时']=parseInt(sp[0])||9; values['分钟']=parseInt(sp[1])||0;
    if(ftype==='每周') values['星期']=document.getElementById('aWday').value;
    if(ftype==='每月') values['每月几号']=parseInt(document.getElementById('aMday').value)||1;
  }
  const r=await fetch('/api/update_multi',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({section:'automations',id:editCtx.id,values})});
  const j=await r.json();
  if(!j.ok){toast('保存失败：'+(j.error||''),true);return;}
  closeEditor(); await load(); toast('已保存至 '+j.path);
}
async function delItem(hid){
  const name=(DATA[activeKey].find(it=>it.id===hid)||{})['名称']||(DATA[activeKey].find(it=>it.id===hid)||{})['主题']||'该条';
  if(!confirm('确定删除「'+name+'」？将从配置中移除（已备份 .bak）。'))return;
  const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({section:activeKey,id:hid})});
  const j=await r.json();
  if(!j.ok){toast('删除失败：'+(j.error||''),true);return;}
  await load(); toast('已删除（备份于 '+j.path+'.bak）');
}
function onSearch(){query=document.getElementById('search').value.trim();render();}
function applyTheme(){ const t=localStorage.getItem('theme'); if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); }
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); const nxt=cur==='dark'?'':'dark'; if(nxt)document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme',nxt); }
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ai-workbench-export-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); toast('已导出全部数据为 JSON');
}
function toast(msg,err){
  const t=document.getElementById('toast');
  if(err){t.innerHTML='<span style="color:#ff9b95">'+msg+'</span>';}
  else{t.innerHTML=msg.replace(/(C:[^<\s]*\.(\w+)?)/g,'<span class="fp">$1</span>');}
  t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800);
}
window.addEventListener('resize',syncTheadTop);
load();
